name: Build example mod

on:
  push:
    branches: [main]
    paths:
      - "examples/example-mod/**"
      - ".github/workflows/build-example.yml"
  pull_request:
    paths:
      - "examples/example-mod/**"
      - ".github/workflows/build-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/example-mod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: microsoft
          java-version: "25"

      - name: Set up Gradle (validates the wrapper)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-mod
          path: examples/example-mod/build/libs/*.jar
          if-no-files-found: error
